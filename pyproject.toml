[project]
name = "paperwerk"
version = "0.1.0"
description = "The mess, re-organized"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Shared — safe in both containers
    "tqdm>=4.67.1",
    "safetensors>=0.7.0",
    "colorama>=0.4.6",
    "datasets>=4.3.0",
    "transformers==5.2.0",
    "pdf2image>=1.17.0",
    "pillow>=11.2.1",
    "multimethod>=2.0.2",
    "openai>=1.55.0",
    "jinja2>=3.1.0",
    "augraphy>=8.2.6",
]

[dependency-groups]
# JAX training stack — install with: uv sync --group training
# Do NOT mix with the serving group; JAX and PyTorch fight over CUDA allocators.
training = [
    "fabrique==0.5.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "playwright>=1.50.0",
]
# PyTorch / vLLM stack — install with: uv sync --group serving
# timm, unsloth, trl are PyTorch-only; keep them out of the training container.
serving = [
    "torch>=2.9.0",
    "vllm>=0.19.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "trl[peft]",
    "bitsandbytes",
    "timm>=1.0.26",
]
dev = [
    "black>=25.1.0",
    "ipython>=9.2.0",
    "isort>=6.0.1",
    "mypy>=1.15.0",
    "pytest>=8.4.1",
    "ruff>=0.13.1",
]


[tool.uv]
default-groups = ["dev"]
override-dependencies = [
    "transformers==5.5.3",
]