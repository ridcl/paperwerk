[project]
name = "paperwerk"
version = "0.1.0"
description = "The mess, re-organized"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tqdm>=4.67.1",
    "safetensors>=0.7.0",
    "colorama>=0.4.6",
    "datasets>=4.3.0",
    "transformers==5.5.3",
    "pdf2image>=1.17.0",
    "pillow>=11.2.1",
    "multimethod>=2.0.2",
    "openai>=1.55.0",
    "jinja2>=3.1.0",
    "augraphy>=8.2.6",
    # Datagen rendering
    "playwright>=1.50.0",
    # PyTorch / vLLM stack — unified on CUDA 13 (host driver 580 / CUDA 13.0).
    # torch resolves to the PyPI default +cu130 build, matching vLLM's cu13
    # wheel, so the whole nvidia-* runtime graph stays on one CUDA major.
    "torch>=2.9.0",
    "vllm>=0.19.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "trl[peft]",
    "bitsandbytes",
    "timm>=1.0.26",
    # Unsloth LoRA fine-tuning. Its published metadata carries stale upper
    # bounds (transformers<=5.5.0, torch<2.11.0, trl<=0.24.0) that predate the
    # vLLM 0.22 / transformers 5.5.3 / torch 2.11 stack we run; the
    # override-dependencies below relax them so the resolver keeps the existing
    # versions instead of downgrading vLLM. unsloth-zoo is pinned alongside
    # because the two are released in lockstep.
    "unsloth>=2026.5.8",
    "unsloth-zoo>=2026.5.4",
    # Triton-kernel linear-attention ops for Qwen3.5 fine-tuning (gated DeltaNet
    # etc.). Pure-Triton, so it rides on the installed triton/torch without a
    # CUDA compile; its only heavy dep is an unversioned `transformers`, which
    # the override keeps at 5.5.3.
    "flash-linear-attention>=0.5.0",
    # FlashAttention-2 without a source build: the `kernels` library fetches a
    # prebuilt FA2 binary matching the runtime torch/CUDA/ABI from the Hub
    # (transformers `attn_implementation="kernels-community/flash-attn2"`). No
    # cu13/torch2.11 flash-attn wheel exists, and FA4 is Hopper/Blackwell-only,
    # so this is the build-free path for Ampere; falls back to sdpa if no variant.
    # Pinned to transformers 5.5.3's supported range — newer kernels (0.13+)
    # made LayerRepository's version mandatory, which breaks transformers'
    # hub_kernels.py at import time.
    "kernels>=0.12.0,<0.13",
    "tensorboardx>=2.6.5",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "ipython>=9.2.0",
    "isort>=6.0.1",
    "mypy>=1.15.0",
    "pytest>=8.4.1",
    "ruff>=0.13.1",
]


[tool.uv]
default-groups = ["dev"]
# Override unsloth's stale ceilings on the two deps that the rest of the stack
# pins higher: transformers (v5 is supported in unsloth's code, only its
# metadata caps it at <=5.5.0) and torch (vLLM 0.22 pulls 2.11, unsloth's
# metadata caps <2.11). We deliberately do NOT override trl/datasets — unsloth's
# upper bounds there (trl<=0.24, datasets<4.4) reflect real API breakage, and
# the repo only needs datasets>=4.3 with an unversioned trl, so letting the
# resolver pick unsloth's tested versions keeps training reproducible.
override-dependencies = [
    "transformers==5.5.3",
    "torch>=2.9.0",
]
